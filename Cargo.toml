[package]
name = "gannondorf"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "unlink"
path = "src/bin/unlink.rs"

[[bin]]
name = "unres"
path = "src/bin/unres.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
iced-x86 = "1.21.0"
object = { version = "0.39.1", features = ["write"] }

[dev-dependencies]
serde_json = "1.0"
