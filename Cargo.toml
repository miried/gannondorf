[package]
name = "gannondorf"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "unlink"
path = "src/bin/unlink.rs"

[[bin]]
name = "unres"
path = "src/bin/unres.rs"

[[bin]]
name = "cxxmap"
path = "src/bin/cxxmap.rs"

[[bin]]
name = "cxxunlink"
path = "src/bin/cxxunlink.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
iced-x86 = "1.21.0"
object = { version = "0.39.1", features = ["write"] }
serde_json = "1.0"
tree-sitter = "0.26.10"
tree-sitter-cpp = "0.23.4"
